<svg width="230" height="145" viewBox="0 0 230 145" xmlns="http://www.w3.org/2000/svg">
  <style>
    .px {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 3.5px;
      font-weight: bold;
      letter-spacing: 0.4px;
      white-space: pre;
    }
    /* 모노톤 그라데이션 */
    .c1 { fill: #f0f6fc; }
    .c2 { fill: #b1bac4; }
    .c3 { fill: #8b949e; }
    .c4 { fill: #484f58; }
    .c5 { fill: #21262d; }

    .b-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: bold;
    }

    .swim { animation: bounce 2.4s ease-in-out infinite; }
    .tail-1 { animation: waveA 0.65s steps(1) infinite; }
    .tail-2 { animation: waveB 0.65s steps(1) infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes waveA {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveB {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>

  
  <text x="58" y="88" font-size="13px" fill="#f0f6fc" class="b-text" opacity="0">O
    <animate attributeName="y" values="88; 45" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="x" values="58; 48" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0.6; 0" keyTimes="0; 0.2; 0.7; 1" dur="2.4s" repeatCount="indefinite" />
  </text>

  <text x="52" y="82" font-size="10px" fill="#b1bac4" class="b-text" opacity="0">o
    <animate attributeName="y" values="82; 35" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
    <animate attributeName="x" values="52; 40" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.95; 0.5; 0" keyTimes="0; 0.2; 0.7; 1" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
  </text>

  <text x="62" y="76" font-size="8px" fill="#8b949e" class="b-text" opacity="0">o
    <animate attributeName="y" values="76; 32" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="x" values="62; 54" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.9; 0.4; 0" keyTimes="0; 0.2; 0.7; 1" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
  </text>

  <text x="55" y="70" font-size="6px" fill="#b1bac4" class="b-text" opacity="0">°
    <animate attributeName="y" values="70; 28" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
    <animate attributeName="x" values="55; 44" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.85; 0.4; 0" keyTimes="0; 0.2; 0.7; 1" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
  </text>

  
  <g class="swim">
    <g transform="translate(55, 42)">
      
      <text x="20" y="10" class="px c5">            ....::::++++****</text>
      <text x="20" y="14" class="px c5">        ..::++**########**++::..</text>
      <text x="20" y="18" class="px c4">      .:++**####@@@@@@@@####**++:.</text>
      <text x="20" y="22" class="px c4">    .:+*##@@@@%%%%%%%%%%%%@@@@##*+:.</text>
      <text x="20" y="26" class="px c3">   :+*#@@@%%%%%%%%%%%%%%%%%%%%@@@#*+:</text>
      <text x="20" y="30" class="px c3">  :+*#@@@%%%%%%@@@@@@@@@@%%%%%%@@@#*+:</text>
      <text x="20" y="34" class="px c2"> :+*#@@@%%%%@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
      <text x="20" y="38" class="px c2">:+*#@@@%%%%@@@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
      <text x="20" y="42" class="px c1">+*#@@@%%%%@@@@@@@@@@@@@@@@@@@@%%%%@@@#*+</text>
      <text x="20" y="46" class="px c1">+*#@@@%%%%@@@@@@@@@@@@@@@@@@@@%%%%@@@#*+</text>
      <text x="20" y="50" class="px c1">:+*#@@@%%%%@@@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
      <text x="20" y="54" class="px c2"> :+*#@@@%%%%@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
      <text x="20" y="58" class="px c2">  :+*#@@@%%%%%%@@@@@@@@@@%%%%%%@@@#*+:</text>
      <text x="20" y="62" class="px c3">   :+*#@@@%%%%%%%%%%%%%%%%%%%%@@@#*+:</text>
      <text x="20" y="66" class="px c3">    .:+*##@@@@%%%%%%%%%%%%@@@@##*+:.</text>
      <text x="20" y="70" class="px c4">      .:++**####@@@@@@@@####**++:.</text>
      <text x="20" y="74" class="px c4">        ..::++**########**++::..</text>
      <text x="20" y="78" class="px c5">            ''''::::++++****</text>

      
      <g class="tail-1">
        <text x="114" y="22" class="px c4">        ..::+*#%</text>
