<svg width="190" height="120" viewBox="0 0 190 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .px {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 3.5px;
      font-weight: bold;
      letter-spacing: 0.4px;
      white-space: pre;
    }
    /* 모노톤 그라데이션 */
    .c1 { fill: #f0f6fc; }
    .c2 { fill: #b1bac4; }
    .c3 { fill: #8b949e; }
    .c4 { fill: #484f58; }
    .c5 { fill: #21262d; }

    /* 크고 확실하게 티나는 뽀글뽀글 물방울 4개 */
    .bubble-1 {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #f0f6fc;
      animation: pop1 2.4s ease-out infinite;
    }
    .bubble-2 {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      fill: #b1bac4;
      animation: pop2 2.4s ease-out infinite 0.6s;
    }
    .bubble-3 {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      fill: #8b949e;
      animation: pop3 2.4s ease-out infinite 1.2s;
    }
    .bubble-4 {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 7px;
      font-weight: bold;
      fill: #b1bac4;
      animation: pop4 2.4s ease-out infinite 1.8s;
    }

    .swim { animation: bounce 2.4s ease-in-out infinite; }
    .tail-1 { animation: waveA 0.65s steps(1) infinite; }
    .tail-2 { animation: waveB 0.65s steps(1) infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes waveA {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveB {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes pop1 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(-12px, -32px) scale(1.1); opacity: 0; }
    }
    @keyframes pop2 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      20% { opacity: 0.95; }
      100% { transform: translate(-16px, -38px) scale(1.05); opacity: 0; }
    }
    @keyframes pop3 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      25% { opacity: 0.9; }
      100% { transform: translate(-6px, -28px) scale(1); opacity: 0; }
    }
    @keyframes pop4 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      25% { opacity: 0.85; }
      100% { transform: translate(-14px, -22px) scale(1); opacity: 0; }
    }
  </style>

  <g class="swim" transform="translate(22, 18)">
    
    <text x="6" y="42" class="bubble-1">O</text>
    <text x="0" y="32" class="bubble-2">o</text>
    <text x="12" y="26" class="bubble-3">o</text>
    <text x="4" y="20" class="bubble-4">°</text>

    
    <text x="20" y="10" class="px c5">            ....::::++++****</text>
    <text x="20" y="14" class="px c5">        ..::++**########**++::..</text>
    <text x="20" y="18" class="px c4">      .:++**####@@@@@@@@####**++:.</text>
    <text x="20" y="22" class="px c4">    .:+*##@@@@%%%%%%%%%%%%@@@@##*+:.</text>
    <text x="20" y="26" class="px c3">   :+*#@@@%%%%%%%%%%%%%%%%%%%%@@@#*+:</text>
    <text x="20" y="30" class="px c3">  :+*#@@@%%%%%%@@@@@@@@@@%%%%%%@@@#*+:</text>
    <text x="20" y="34" class="px c2"> :+*#@@@%%%%@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
    <text x="20" y="38" class="px c2">:+*#@@@%%%%@@@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
    <text x="20" y="42" class="px c1">+*#@@@%%%%@@@@@@@@@@@@@@@@@@@@%%%%@@@#*+</text>
    <text x="20" y="46" class="px c1">+*#@@@%%%%@@@@@@@@@@@@@@@@@@@@%%%%@@@#*+</text>
    <text x="20" y="50" class="px c1">:+*#@@@%%%%@@@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
    <text x="20" y="54" class="px c2"> :+*#@@@%%%%@@@@@@@@@@@@@@@@%%%%@@@#*+:</text>
    <text x="20" y="58" class="px c2">  :+*#@@@%%%%%%@@@@@@@@@@%%%%%%@@@#*+:</text>
    <text x="20" y="62" class="px c3">   :+*#@@@%%%%%%%%%%%%%%%%%%%%@@@#*+:</text>
    <text x="20" y="66" class="px c3">    .:+*##@@@@%%%%%%%%%%%%@@@@##*+:.</text>
    <text x="20" y="70" class="px c4">      .:++**####@@@@@@@@####**++:.</text>
    <text x="20" y="74" class="px c4">        ..::++**########**++::..</text>
    <text x="20" y="78" class="px c5">            ''''::::++++****</text>

    
    <g class="tail-1">
      <text x="114" y="22" class="px c4">        ..::+*#%</text>
      <text x="114" y="26" class="px c3">      ..:+*#%@@@</text>
      <text x="114" y="30" class="px c2">    .:+*#%@@@@@@</text>
      <text x="114" y="34" class="px c2">  .:+*#%@@@@@@*:</text>
      <text x="114" y="38" class="px c1">:+*#%@@@@@@*:.  </text>
      <text x="114" y="42" class="px c1">+*#%@@@@*:.     </text>
      <text x="114" y="46" class="px c1">+*#%@@@@*:.     </text>
      <text x="114" y="50" class="px c1">:+*#%@@@@@@*:.  </text>
      <text x="114" y="54" class="px c2">  .:+*#%@@@@@@*:</text>
      <text x="114" y="58" class="px c2">    .:+*#%@@@@@@</text>
      <text x="114" y="62" class="px c3">      ..:+*#%@@@</text>
      <text x="114" y="66" class="px c4">        ..::+*#%</text>
    </g>

    
    <g class="tail-2">
      <text x="114" y="22" class="px c4">       ..::+*#%</text>
      <text x="114" y="26" class="px c3">     ..:+*#%@@@</text>
      <text x="114" y="30" class="px c2">   .:+*#%@@@@@@</text>
      <text x="114" y="34" class="px c2"> .:+*#%@@@@@@*:</text>
      <text x="114" y="38" class="px c1">+*#%@@@@@@*:.  </text>
      <text x="114" y="42" class="px c1">*#%@@@@*:.     </text>
      <text x="114" y="46" class="px c1">*#%@@@@*:.     </text>
      <text x="114" y="50" class="px c1">+*#%@@@@@@*:.  </text>
      <text x="114" y="54" class="px c2"> .:+*#%@@@@@@*:</text>
      <text x="114" y="58" class="px c2">   .:+*#%@@@@@@</text>
      <text x="114" y="62" class="px c3">     ..:+*#%@@@</text>
      <text x="114" y="66" class="px c4">       ..::+*#%</text>
    </g>
  </g>
</svg>