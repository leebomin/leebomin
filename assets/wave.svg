<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .hand {
      font-size: 24px;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      transform-origin: 26px 30px;
      animation: wave 2.5s ease-in-out infinite;
    }
    @keyframes wave {
      0%   { transform: rotate(0deg); }
      10%  { transform: rotate(14deg); }
      20%  { transform: rotate(-8deg); }
      30%  { transform: rotate(14deg); }
      40%  { transform: rotate(-4deg); }
      50%  { transform: rotate(10deg); }
      60%  { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
  <text class="hand" x="8" y="30">👋</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
